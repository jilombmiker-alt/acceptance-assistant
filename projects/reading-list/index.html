<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读清单</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f6f5f1;color:#273831;font:16px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:800px;margin:48px auto;padding:32px;background:white;border:1px solid #d7ddd5;border-radius:10px}h1{font-size:30px}label{display:block}input,select,button{font:inherit;padding:10px 14px;min-height:44px;border:1px solid #a8b4aa;border-radius:5px}input{width:100%;margin:8px 0 14px}button{cursor:pointer;background:#2a5d47;color:white}select{background:white}nav,.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:20px 0}a{color:#295b48}li{margin:12px 0;padding:14px;border:1px solid #d7ddd5;display:flex;gap:20px;align-items:center;justify-content:space-between}ul{padding:0;list-style:none}small{color:#53645a}:focus-visible{outline:3px solid #95691c;outline-offset:3px}@media(max-width:600px){main{margin:16px 12px;padding:20px}li{flex-wrap:wrap}}</style></head><body><main><small>受控验证样例 · 不代表真实项目</small><h1>阅读清单</h1><nav><a href="help.html">使用说明</a></nav><form id="add-form"><label>书名<input name="title" required maxlength="100"></label><button type="submit">添加书目</button></form><p role="status" id="notice">清单已就绪</p><div class="tools"><label>查看状态 <select id="filter"><option value="all">全部</option><option value="read">已读</option></select></label><button id="export">导出清单</button></div><p data-testid="summary"></p><ul id="books" aria-label="书目列表"></ul></main><script src="app.js"></script></body></html>
